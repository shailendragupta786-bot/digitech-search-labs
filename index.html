<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Digitech Search Labs - Technical SEO & AI Optimization for High-Intent Visibility</title>
    <meta name="description" content="We engineer 100% crawl-healthy websites and lock Google 3-Pack dominance. 24+ years technology heritage. Delhi/NCR specialist in medical, local, and enterprise SEO." />
    <meta name="keywords" content="Technical SEO, Local SEO, Google Business Profile, Medical SEO, Delhi, Ghaziabad" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://digitechsearchlabs.com/" />
    <meta property="og:title" content="Digitech Search Labs - Technical SEO Engineering" />
    <meta property="og:description" content="We build 100% crawl-healthy websites and dominate Google 3-Pack. AI-ready schema, zero 404 errors, measurable results." />
    <meta property="og:image" content="https://digitechsearchlabs.com/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://digitechsearchlabs.com/" />
    <meta property="twitter:title" content="Digitech Search Labs - Technical SEO Engineering" />
    <meta property="twitter:description" content="We build 100% crawl-healthy websites and dominate Google 3-Pack." />
    <meta property="twitter:image" content="https://digitechsearchlabs.com/og-image.jpg" />
    
    <!-- Additional Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0F172A" />
    
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Preconnect for Google Analytics -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://digitechsearchlabs.com/" />
    
    <!-- Google Analytics (deferred until user interaction) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      function loadGA(){
        if(window.gaLoaded) return;
        window.gaLoaded = true;
        
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-661BCVDZ1Y';
        document.head.appendChild(s);
        
        gtag('js', new Date());
        gtag('config', 'G-661BCVDZ1Y');
      }
      
      // Load GA on first user interaction or after 3.5s (whichever comes first)
      ['scroll', 'mousemove', 'touchstart', 'click'].forEach(e => 
        window.addEventListener(e, loadGA, {once:true, passive:true})
      );
      setTimeout(loadGA, 3500);
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
